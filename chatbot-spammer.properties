# CHATBOX SPAMMER
# This file defines phrases detected in chat and the automatic responses sent by the spammer.
# Format: word or phrase=spammer response
# Matching is case-sensitive. The spammer reacts only to the complete word or phrase.
# {user} is replaced with the message author's username.
# Advanced rule: {occurrence_count|window_ms|max_repetitions}phrase=response
# Example: {2|5000|3}LUL=LUL
# Example: LUL=LUL|xD


{3|2000|2}LOL=LOL
{3|2000|2}LUL=LUL
{2|2000|1}hiii=hiii
