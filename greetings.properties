# COMMAND USED TO ENABLE OR DISABLE GREETINGS
toggle.command=hi

# all = every new user; defined = only users listed under allowed.users
mode=defined

# RANDOM GREETING MESSAGES (one message per line)
messages=
Yo @{user}
hiii @{user}

# RANDOM GOODBYE MESSAGES (one message per line)
# Every group selects a message separately; the same message is never used twice in a row.
# The program appends up to 12 usernames; optionally use {users} to choose their position.
farewell.messages=
byeee
see you
KEKBye 

# ALLOWED USERS FOR mode=defined (without @, one username per line)
allowed.users=


# After successfully sending a greeting, the program remembers the user in every mode.
# Greetings use response.delay.* and response.interval.* from config.properties.
# The program automatically adds greeted users below in this format:
# greeted.user.login=true
# The "Goodbye: OFF" button disables greetings and sends goodbye messages
# in batches of up to 12 users, using response.interval.* between batches.
# Successfully processed users are removed from this list.
# After all batches are sent, only the goodbye operation ends; the application stays open.
