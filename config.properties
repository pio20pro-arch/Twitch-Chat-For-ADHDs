# Copy this file as config.properties and fill in the values.
# WARNING: oauth.token is a secret — never share this file with anyone.



# Client ID of the Twitch application that issued oauth.token.
# Required for the CHATTERS column; changing it requires an application restart.
channel=
client.id=
oauth.token=
bot.username=


# Other names people use when addressing you in chat, separated by commas or semicolons.
# bot.username is always recognized automatically. Changes are reloaded without a restart.
bot.mention.aliases=


# MODERATOR MODE: on shows the CHATTERS column and enables Twitch Helix requests.
# off removes the column and makes no chatters API requests. Changing it requires a restart.
mod.mode=off


# EMOTE COLUMN: on adds the left emote picker; off removes it. Restart required.
emotes.column=on
# Initial preview animation state; it can also be toggled inside the emote column.
emotes.animation=on
# on displays recognized emotes as native 1x images in Full Chat, Watched, and threads.
# Animated message emotes follow the same Animation: ON/OFF button. Restart required.
emotes.chat=on
# Emote tile area in pixels (20-64). Images use the providers' native 1x versions. Restart required.
emotes.icon.size=32


# SPELL CHECKING
# Comma-separated LanguageTool dictionaries. Missing modules are downloaded during the next build.
# Examples: en-US, pl-PL, de-DE, fr. Chinese and Japanese modules have no spelling dictionary.
# Leave empty to disable spelling checks. Changing this setting requires rebuilding/restarting.
spellcheck.languages=en-US
# GRAMMAR CHECKING
# Chinese and Japanese LanguageTool modules provide grammar rules but no spelling dictionary.
# Grammar results use the same underline and suggestion menu as spelling results.
# Missing modules are downloaded during the next build. Leave empty to disable grammar checking.
# Changing this setting requires rebuilding/restarting.
# grammar.languages=ja,zh


# CHATBOX SPAMMER AND GREETINGS
# These response.* file settings control automatic messages. They do not affect manual chat replies.


# CHATBOX SPAMMER : 0.35 means responding to approximately 35% of rule matches.
# Keep it very low! 0.05 - 0.15 usualy is good enouth 
response.chance=0.08

# CHATBOX SPAMMER + GREETINGS: random delay before sending, in milliseconds.
response.delay.min.ms=1853
response.delay.max.ms=3952

# CHATBOX SPAMMER + GREETINGS + GOODBYE: shared interval between automatic messages.
# This prevents the features from sending over one another. Values are in milliseconds.
response.interval.min.ms=6000
response.interval.max.ms=10000

# CHATBOX SPAMMER only: do not repeat the same generated response during this cooldown.
response.same.cooldown.ms=80000

# Full-chat filters for the left panel (reloaded automatically).
# true hides messages consisting only of recognized emotes or Unicode phone emoji.
chat.filter.emote.only=true

# Comma-separated language codes, like spellcheck.languages. The filter recognizes writing systems,
# so languages sharing one alphabet are filtered together. Changes are reloaded automatically.
# Common codes: zh, ja, ko, ar, fa, ur, ru, uk, be, el, he, yi, th, hi, mr, ne,
# bn, ta, km, my, lo, si, te, kn, ml, gu, pa, ka, hy, am, ti.
# Latin-based codes such as en, pl, de, fr, es or pt filter every Latin-script language.
# A Java Unicode script name such as cyrillic, hebrew or thai can also be used directly.
chat.filter.languages=zh,ja,ko

# Separate text fragments with commas or semicolons; leave empty to hide nothing.
chat.filter.contains=

# Hide messages shorter than this number of characters; 0 disables the filter.
chat.filter.min.length=6

# Chat font size in points (8-24) and spacing between messages in pixels (0-20).
chat.font.size=11
chat.line.spacing=2

# Automatically open detected threads: watched = only users from watched.users,
# all = everyone. Users from excluded.users are always ignored.
thread.auto.open=watched

# WATCHED USERS
# Highlighted in chat and shown in the Watched tab, one username per line.
# With thread.auto.open=watched, their detected threads open automatically.
# This list does not control Greetings or Chatbox Spammer responses.
# You can add your MODs here or Friends
watched.users=

# EXCLUDED USERS
# Hidden from full chat; no automatic greeting, goodbye, or automatic thread opening.
# They can still trigger Chatbox Spammer rules from chatbot-spammer.properties.
# add here Bots or use as users filter
excluded.users=
StreamElements


# All greeting settings are stored in one file.
greeting.config.file=greetings.properties

# File containing Chatbox Spammer triggers and responses (reloaded automatically).
spammer.config.file=chatbot-spammer.properties

